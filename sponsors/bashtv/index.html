<title>Taking you to Bash.tv&hellip;</title>
<link rel="canonical" href="https://bash.tv/">

<!-- Only for visitors without JavaScript. Everyone else goes through the script
     below, which records the visit first - an instant meta refresh here would
     leave before Analytics had a chance to send anything. -->
<noscript><meta http-equiv="refresh" content="0; url=https://bash.tv/"></noscript>

<script>
  /* Tracked sponsor redirect.

     The point of this page existing at /sponsors/bashtv (instead of the homepage
     linking straight to bash.tv) is so Google Analytics logs a page_view for this
     path. That only works if the hit is sent BEFORE we navigate away, so:

       1. queue a page_view with transport_type "beacon" - the browser keeps a
          beacon alive even while the page is unloading
       2. redirect from its event_callback, i.e. once GA confirms it was sent
       3. but never wait more than FALLBACK_MS - if an ad blocker stops gtag.js
          from loading, the callback never fires and the visitor would be stuck

     analytics.js is deliberately NOT included: it fires its own page_view with
     no callback, which would double-count this visit.

     To reuse this for another sponsor, copy the folder and change DEST. */
  var DEST = "https://bash.tv/";
  var MEASUREMENT_ID = "G-S286YSQPJ5";
  var FALLBACK_MS = 1500;

  var left = false;
  function go(){
    if(left) return;
    left = true;
    /* replace() so this hop isn't in the back-button history - otherwise Back
       from bash.tv would land here and bounce straight forward again */
    location.replace(DEST);
  }

  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", MEASUREMENT_ID, { send_page_view: false });
  gtag("event", "page_view", {
    transport_type: "beacon",
    event_callback: go
  });

  setTimeout(go, FALLBACK_MS);
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S286YSQPJ5"></script>
