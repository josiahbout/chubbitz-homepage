<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b0e">
<title>Redirecting to Discord&hellip;</title>

<!-- How the link previews when it's shared (Discord, iMessage, X, Facebook...).
     og:image must be an absolute URL - a relative one is silently ignored.
     Platforms cache these hard; rename the image to force a re-fetch. -->
<meta property="og:site_name" content="The Chubbitz">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thechubbitz.com/discord">
<meta property="og:title" content="Join The Chub Club">
<meta property="og:description" content="The Chubbitz community on Discord. It's free and fun!">
<meta property="og:image" content="https://thechubbitz.com/media/embed_banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Chubbitz">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join The Chub Club">
<meta name="twitter:description" content="The Chubbitz community on Discord. It's free and fun!">
<meta name="twitter:image" content="https://thechubbitz.com/media/embed_banner.png">

<!-- Belt and braces: the meta refresh fires even with JavaScript disabled, the
     script below fires instantly for everyone else, and the visible link is
     there if a browser somehow honours neither. -->
<meta http-equiv="refresh" content="0; url=https://discord.gg/G9R9sPUDy8">
<link rel="canonical" href="https://discord.gg/G9R9sPUDy8">

<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0b0e;
    color:#a3a9b4;
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-align:center;
    padding:24px;
  }
  p{ margin:0; font-size:15px; line-height:1.6; }
  a{ color:#8ec9ff; font-weight:700; }
</style>
</head>
<body>
  <p>
    Taking you to Discord&hellip;<br>
    <a href="https://discord.gg/G9R9sPUDy8">Click here if nothing happens.</a>
  </p>

  <script>
    // replace() rather than assign() so /discord doesn't sit in the back-button
    // history — otherwise going Back from Discord would bounce you straight in again.
    location.replace('https://discord.gg/G9R9sPUDy8');
  </script>
</body>
</html>
