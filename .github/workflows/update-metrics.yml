# Once a day, reads the Total Followers count from link.me/thechubbitz plus the
# Discord server's member count, and updates the homepage stat (metrics.js) and
# the /growth history (data/followers.json). Runs on GitHub's servers - no
# computer needs to be on.
#
# To run it right now: GitHub > Actions > "Update follower metrics" > Run workflow.

name: Update follower metrics

on:
  schedule:
    # 13:17 UTC daily. An odd minute on purpose: the top of the hour is when
    # GitHub is busiest and scheduled runs get delayed most.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the new numbers
  pages: write      # ask GitHub Pages to rebuild the live site

concurrency:
  group: update-metrics
  cancel-in-progress: false

env:
  LINKME_URL: https://link.me/thechubbitz
  # The Chub Club's permanent invite. The member count comes from Discord's
  # public invite API, which needs no login.
  DISCORD_INVITE: G9R9sPUDy8
  USER_AGENT: thechubbitz.com follower updater (+https://thechubbitz.com)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Download the link.me profile
        run: |
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 10 --max-time 30 \
               --user-agent "$USER_AGENT" \
               --output "$RUNNER_TEMP/linkme.html" \
               "$LINKME_URL"

      # Optional: if Discord is down, the job still updates everything else and
      # the updater leaves Discord out for the day with a warning.
      - name: Download the Discord member count
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 10 --max-time 30 \
               --user-agent "$USER_AGENT" \
               --output "$RUNNER_TEMP/discord.json" \
               "https://discord.com/api/v10/invites/$DISCORD_INVITE?with_counts=true"

      - name: Update metrics.js and the follower history
        run: perl scripts/update-metrics.pl "$RUNNER_TEMP/linkme.html" "discord=$RUNNER_TEMP/discord.json"

      - name: Commit and push if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- metrics.js data/followers.json)" ]; then
            echo "Nothing changed - no commit needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.js data/followers.json
          git commit -m "Update follower count ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token doesn't reliably kick off a
      # Pages build, so ask for one explicitly. Scheduled runs only do this when
      # they pushed new numbers; a manual "Run workflow" always does, so it
      # doubles as a "refresh the live site" button.
      - name: Rebuild the live site
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
          echo "GitHub Pages rebuild requested."
