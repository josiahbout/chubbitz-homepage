# Keeps sitemap.xml in step with the site's pages. Runs whenever an .html file
# is pushed, so a new page is added - and a deleted one dropped - automatically.
# Pages with <meta name="robots" content="noindex"> are left out.
#
# To run it by hand: GitHub > Actions > "Update sitemap" > Run workflow.

name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "scripts/build-sitemap.pl"
      - ".github/workflows/sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed sitemap
  pages: write      # ask GitHub Pages to rebuild the live site

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so each page's last-changed date is real

      - name: Build sitemap.xml
        run: perl scripts/build-sitemap.pl

      - name: Commit and push if it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml)" ]; then
            echo "Sitemap already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap"
          # the daily follower job may have pushed in the meantime
          git pull --rebase --quiet
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token doesn't reliably kick off a
      # Pages build, so ask for one explicitly.
      - name: Rebuild the live site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
          echo "GitHub Pages rebuild requested."
