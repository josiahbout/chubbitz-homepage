# Once a day, adds up what supporters have paid through Stripe and updates the
# "$N raised" figure and bar on /support (raised.js) plus its history
# (data/raised.json). Runs on GitHub's servers - no computer needs to be on.
#
# To run it right now: GitHub > Actions > "Update amount raised" > Run workflow.
# That doubles as a "refresh the figure" button after a notable payment.
#
# SETUP - one thing to do by hand:
#   Stripe > Developers > API keys > Create restricted key.
#   Give it READ access to "Balance transactions" and nothing else.
#   Then GitHub > this repo > Settings > Secrets and variables > Actions >
#   New repository secret, named STRIPE_READ_KEY.
# Until that secret exists the job skips itself and says so, rather than
# failing every day.
#
# To change how often it runs, edit the cron line below. Every six hours would
# be "17 */6 * * *". GitHub delays scheduled runs when it's busy, sometimes by
# hours, so treat the time as "about then" rather than a promise.

name: Update amount raised

on:
  schedule:
    # 12:41 UTC daily. An odd minute on purpose: the top of the hour is when
    # GitHub is busiest and scheduled runs get delayed most.
    - cron: "41 12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the new figure
  pages: write      # ask GitHub Pages to rebuild the live site

concurrency:
  group: update-raised
  cancel-in-progress: false

env:
  # The day daily tracking began. Payments before it are carried as the
  # baseline in scripts/update-raised.pl; change both together or not at all.
  STRIPE_START: "2026-11-04"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check the Stripe key is set
        id: key
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_READ_KEY }}
        run: |
          if [ -z "$STRIPE_KEY" ]; then
            echo "::warning::No STRIPE_READ_KEY secret set, so the raised figure was left alone. See the comment at the top of this workflow for how to add one."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Stripe returns 100 rows at a time, so keep asking until it says there
      # are no more. The key goes in a config file rather than on the command
      # line, where it would show up in the process list.
      - name: Download the payments from Stripe
        if: steps.key.outputs.ready == 'true'
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_READ_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stripe"
          printf 'user = "%s:"\n' "$STRIPE_KEY" > "$RUNNER_TEMP/curlrc"
          chmod 600 "$RUNNER_TEMP/curlrc"

          since=$(date -u -d "$STRIPE_START 00:00:00" +%s)
          after=""
          page=0

          while [ "$page" -lt 50 ]; do
            page=$((page + 1))
            url="https://api.stripe.com/v1/balance_transactions?limit=100&created%5Bgte%5D=$since"
            if [ -n "$after" ]; then url="$url&starting_after=$after"; fi
            out=$(printf '%s/stripe/page-%03d.json' "$RUNNER_TEMP" "$page")

            curl --config "$RUNNER_TEMP/curlrc" \
                 --fail --silent --show-error --location \
                 --retry 3 --retry-delay 10 --max-time 30 \
                 --output "$out" "$url"

            has_more=$(jq -r '.has_more // false' "$out")
            after=$(jq -r '.data[-1].id // empty' "$out")
            if [ "$has_more" != "true" ] || [ -z "$after" ]; then break; fi
          done

          rm -f "$RUNNER_TEMP/curlrc"
          echo "Downloaded $page page(s) of balance transactions."

      - name: Update raised.js and the history
        if: steps.key.outputs.ready == 'true'
        run: perl scripts/update-raised.pl "$RUNNER_TEMP/stripe"

      - name: Commit and push if anything changed
        id: commit
        if: steps.key.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain -- raised.js data/raised.json)" ]; then
            echo "Nothing changed - no commit needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raised.js data/raised.json
          git commit -m "Update amount raised ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token doesn't reliably kick off a
      # Pages build, so ask for one explicitly.
      - name: Rebuild the live site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
          echo "GitHub Pages rebuild requested."
