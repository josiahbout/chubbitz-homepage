<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0e">
<meta name="robots" content="noindex">
<title>Follower growth — The Chubbitz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Same tokens as the homepage and the other sub-pages. */
  :root{
    --bg:#0a0b0e;
    --bg-soft:#121419;
    --text:#f4f5f7;
    --text-dim:#a3a9b4;
    --text-faint:#6b7280;
    --line:rgba(255,255,255,.09);
    --line-hover:rgba(255,255,255,.2);
    --card:rgba(255,255,255,.045);
    --accent:#4f8ef7;
    --accent-2:#8ec9ff;
    --up:#4ade80;
    --down:#f87171;
    --radius-lg:20px;
    --radius-md:16px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  a{color:inherit;}
  [hidden]{ display:none !important; }

  /* Positioned against the page, not the column, so it reaches the screen edges.
     Absolute against the viewport box, so width:100% can't cause a sideways scroll. */
  .glow{
    position:absolute;
    top:-130px;
    left:0;
    width:100%;
    height:480px;
    pointer-events:none;
    background:radial-gradient(ellipse 80% 55% at 50% 30%, rgba(79,142,247,.24), transparent 70%);
  }
  .page{
    position:relative;
    z-index:1;
    max-width:760px;
    margin:0 auto;
    padding:0 18px 48px;
  }

  .home-link{
    display:inline-flex;
    margin-top:20px;
    color:var(--text-dim);
    transition:color .15s ease, transform .15s ease;
  }
  .home-link:hover{ color:var(--text); transform:translateY(-1px); }
  .home-link svg{ width:22px; height:22px; display:block; }

  /* ---------- Header ---------- */
  header.top{
    text-align:center;
    padding:10px 0 22px;
  }
  h1{
    margin:0;
    font-family:"Fredoka", sans-serif;
    font-weight:700;
    font-size:clamp(30px, 8.5vw, 42px);
    line-height:1.05;
    letter-spacing:.01em;
    color:#fff;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    padding:5px 12px;
    border-radius:999px;
    background:rgba(79,142,247,.12);
    border:1px solid rgba(79,142,247,.28);
    color:var(--accent-2);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent-2);
    animation:live 2s ease-out infinite;
  }
  @keyframes live{
    0%  { box-shadow:0 0 0 0 rgba(142,201,255,.55); }
    70% { box-shadow:0 0 0 7px rgba(142,201,255,0); }
    100%{ box-shadow:0 0 0 0 rgba(142,201,255,0); }
  }

  /* shown only while the graph is still on made-up numbers */
  .sample-note{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin:0 0 12px;
    padding:11px 14px;
    border-radius:var(--radius-md);
    background:rgba(250,204,21,.07);
    border:1px solid rgba(250,204,21,.28);
    color:#fde68a;
    font-size:13px;
    line-height:1.45;
  }
  .sample-note svg{ flex:none; width:16px; height:16px; margin-top:1px; }
  .sample-note b{ color:#fef3c7; }

  /* ---------- Summary cards ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:12px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:13px 14px 14px;
    min-width:0;
  }
  .stat-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat-value{
    margin-top:6px;
    font-family:"Inter", system-ui, sans-serif;   /* numbers read more clearly in Inter than Fredoka */
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    font-size:clamp(22px, 5.4vw, 28px);
    font-weight:800;
    line-height:1;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat-sub{
    margin-top:6px;
    font-size:12px;
    font-weight:700;
    color:var(--text-faint);
  }
  .is-up{ color:var(--up); }
  .is-down{ color:var(--down); }
  @media (max-width:560px){
    .stats{ grid-template-columns:1fr 1fr; }
    .stat-total{ grid-column:1 / -1; }
  }

  /* ---------- Per-platform cards ---------- */
  .section-title{
    margin:18px 4px 8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .platforms{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:10px;
    margin-bottom:12px;
  }
  .platform{
    position:relative;
    overflow:hidden;
    display:block;
    width:100%;
    appearance:none;
    text-align:left;
    font:inherit;
    color:inherit;
    cursor:pointer;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:12px 13px 13px 16px;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .platform::before{            /* platform colour strip down the left edge */
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--c);
  }
  .platform:hover{ border-color:var(--line-hover); transform:translateY(-1px); }
  .platform[aria-pressed="true"]{
    border-color:var(--c);
    background:rgba(255,255,255,.07);
  }
  .platform-name{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
  }
  .platform-count{
    display:block;
    margin-top:6px;
    font-family:"Inter", system-ui, sans-serif;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    font-size:21px;
    font-weight:800;
    line-height:1;
    color:#fff;
  }
  .platform-meta{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin-top:7px;
    font-size:11.5px;
    font-weight:700;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .dot{
    flex:none;
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--c);
  }

  /* ---------- Chart ---------- */
  .chart-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 12px 10px;
  }
  .chart-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 4px 10px;
  }
  .chart-title{
    min-width:0;
    font-family:"Fredoka", sans-serif;
    font-size:17px;
    font-weight:700;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chart-title small{
    margin-left:6px;
    font-family:"Inter", sans-serif;
    font-size:11px;
    font-weight:700;
    color:var(--text-faint);
  }
  .range{
    flex:none;
    display:inline-flex;
    padding:3px;
    border-radius:999px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
  }
  .range button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font:inherit;
    font-size:12px;
    font-weight:700;
    padding:5px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .range button:hover{ color:var(--text); }
  .range button[aria-pressed="true"]{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0a0b0e;
  }
  .range button:disabled{ opacity:.35; cursor:default; }

  /* which line(s) the graph shows */
  .series{
    display:flex;
    gap:6px;
    margin:0 4px 10px;
    padding-bottom:2px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .series::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.03);
    color:var(--text-dim);
    font:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .chip:hover{ color:var(--text); }
  .chip[aria-pressed="true"]{
    color:#fff;
    border-color:var(--c, rgba(255,255,255,.35));
    background:rgba(255,255,255,.07);
  }
  .dots{ display:inline-flex; }
  .dots .dot{ margin-left:-2px; box-shadow:0 0 0 1.5px #16181d; }
  .dots .dot:first-child{ margin-left:0; }

  .chart{
    position:relative;
    height:280px;
    touch-action:pan-y;
  }
  @media (max-width:560px){ .chart{ height:230px; } }
  .chart svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
  }
  .grid{ stroke:rgba(255,255,255,.07); stroke-width:1; }
  .ylab, .xlab{
    fill:var(--text-faint);
    font-size:11px;
    font-weight:600;
    font-family:"Inter",system-ui,sans-serif;
  }
  /* every line is drawn dotted */
  .line{ fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-dasharray:6 5; opacity:.9; }
  .line-glow{ fill:none; stroke-width:7; opacity:.35; stroke-dasharray:6 5; }
  .end-dot{ fill:#fff; stroke:var(--c); stroke-width:2.5; }
  .end-halo{
    fill:var(--c);
    opacity:.35;
    transform-box:fill-box;
    transform-origin:center;
    animation:halo 2.2s ease-out infinite;
  }
  @keyframes halo{
    0%  { transform:scale(.6); opacity:.5; }
    100%{ transform:scale(2.2); opacity:0; }
  }
  .hover-line{ stroke:rgba(255,255,255,.28); stroke-width:1; stroke-dasharray:3 3; }
  .hover-dot{ fill:#0a0b0e; stroke:var(--c); stroke-width:2.5; }

  /* lines wipe in from the left, then the fill fades up. No fill-mode, so the
     clip is gone once the wipe finishes and never trims the glow. */
  .intro .line, .intro .line-glow{ animation:wipe 1.1s cubic-bezier(.4,0,.2,1); }
  .intro .area{ animation:rise .8s .3s ease both; }
  .intro .end-dot{ opacity:0; animation:pop .3s 1s ease forwards; }
  .intro .end-halo{ animation-delay:1s; }
  @keyframes wipe{ from{ clip-path:inset(0 100% 0 0); } to{ clip-path:inset(0 0 0 0); } }
  @keyframes rise { from{ opacity:0; } to{ opacity:1; } }
  @keyframes pop  { to{ opacity:1; } }

  .tip{
    position:absolute;
    left:0;
    top:0;
    pointer-events:none;
    padding:7px 10px;
    border-radius:10px;
    background:rgba(10,11,14,.93);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    white-space:nowrap;
    opacity:0;
    transition:opacity .12s ease;
  }
  .tip.on{ opacity:1; }
  .tip-date{ font-size:11px; font-weight:600; color:var(--text-faint); }
  .tip-value{ margin-top:2px; font-family:"Inter", system-ui, sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em; font-size:16px; font-weight:800; color:#fff; }
  .tip-delta{ margin-top:1px; font-size:11.5px; font-weight:700; }
  .tip-rows{ display:grid; gap:3px; margin-top:4px; }
  .tip-row{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text-dim); }
  .tip-row .num{ margin-left:auto; padding-left:10px; color:#fff; font-weight:700; }
  .tip-row .chg{ min-width:46px; text-align:right; font-weight:700; }

  .empty{
    display:grid;
    place-items:center;
    height:100%;
    color:var(--text-faint);
    font-size:13px;
    text-align:center;
  }

  footer{
    margin-top:22px;
    text-align:center;
    font-size:11.5px;
    line-height:1.7;
    color:var(--text-faint);
  }
  footer a{ color:var(--text-faint); text-decoration:none; border-bottom:1px solid var(--line); }
  footer a:hover{ color:var(--text-dim); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .intro .end-dot{ opacity:1; }
  }
</style>
<script src="/analytics.js" defer></script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<div class="page">
  <a class="home-link" href="/" aria-label="The Chubbitz home" data-track="growth_home">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.5 9.5V19C5.5 19.5523 5.94772 20 6.5 20H9.5C10.0523 20 10.5 19.5523 10.5 19V15C10.5 14.4477 10.9477 14 11.5 14H12.5C13.0523 14 13.5 14.4477 13.5 15V19C13.5 19.5523 13.9477 20 14.5 20H17.5C18.0523 20 18.5 19.5523 18.5 19V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <header class="top">
    <h1>Follower <em>growth</em></h1>
    <span class="kicker"><span class="live-dot" aria-hidden="true"></span><span id="updated">Updated daily</span></span>
  </header>

  <p class="sample-note" id="sample-note" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
    <span id="sample-text"><b>Sample data.</b> The graph is showing made-up numbers until real daily tracking has a couple of days to plot.</span>
  </p>

  <section class="stats" aria-label="Summary">
    <div class="stat stat-total">
      <div class="stat-label" id="stat-total-label">Total followers</div>
      <div class="stat-value" id="stat-total">&ndash;</div>
      <div class="stat-sub" id="stat-total-sub">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="stat-label" id="stat-change-label">30-day change</div>
      <div class="stat-value" id="stat-change">&ndash;</div>
      <div class="stat-sub" id="stat-change-pct">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="stat-label">Avg per day</div>
      <div class="stat-value" id="stat-avg">&ndash;</div>
      <div class="stat-sub" id="stat-avg-sub">&nbsp;</div>
    </div>
  </section>

  <section class="chart-card" aria-label="Follower growth chart">
    <div class="chart-head">
      <span class="chart-title" id="chart-title">Followers over time</span>
      <div class="range" role="group" aria-label="Time range">
        <button type="button" data-days="7" data-track="growth_range" data-track-label="7d">7D</button>
        <button type="button" data-days="30" data-track="growth_range" data-track-label="30d" aria-pressed="true">30D</button>
        <button type="button" data-days="0" data-track="growth_range" data-track-label="all">All</button>
      </div>
    </div>
    <div class="series" id="series" role="group" aria-label="Which followers to show" hidden></div>
    <div class="chart" id="chart">
      <svg id="chart-svg" role="img" aria-label="Line chart of total followers over time"></svg>
      <div class="tip" id="tip" aria-hidden="true">
        <div class="tip-date" id="tip-date"></div>
        <div class="tip-value" id="tip-value"></div>
        <div class="tip-delta" id="tip-delta"></div>
        <div class="tip-rows" id="tip-rows"></div>
      </div>
    </div>
  </section>

  <h2 class="section-title" id="platforms-title" hidden>By platform</h2>
  <section class="platforms" id="platforms" aria-label="Followers by platform"></section>

  <footer>
    Updates once a day.
    <br><a href="/">The Chubbitz</a>
  </footer>
</div>

<script>
(function () {
  /* The daily GitHub job appends one entry per day:
       {"date": "2026-09-12", "followers": 61200, "platforms": {"instagram": 50800, ...}}
     Days from before tracking began also carry "estimated": true. */
  var DATA_URL = "/data/followers.json";

  /* Until the history has this many days, the page shows sample data instead,
     so there's something to look at from day one. */
  var MIN_REAL_DAYS = 2;

  /* ===== PLATFORMS =====
     Display name and colour for each platform the daily job records.
     Every platform link.me gives a follower count for shows up on this page by
     itself - one missing from this list still appears, just named after its
     website with a spare colour. To tidy up a new one, add a line here. */
  /* unit: what the count is called on that platform (default "followers") */
  var PLATFORMS = {
    instagram: { name: "Instagram", color: "#ec4899" },
    youtube:   { name: "YouTube",   color: "#ef4444" },
    tiktok:    { name: "TikTok",    color: "#2dd4bf" },
    discord:   { name: "Discord",   color: "#7c86ff", unit: "members" },
    x:         { name: "X",         color: "#e5e7eb" },
    threads:   { name: "Threads",   color: "#a78bfa" },
    facebook:  { name: "Facebook",  color: "#60a5fa" },
    twitch:    { name: "Twitch",    color: "#a970ff" },
    bluesky:   { name: "Bluesky",   color: "#38bdf8" }
  };
  var SPARE_COLORS = ["#fbbf24", "#a3e635", "#fb923c", "#c084fc", "#34d399"];
  var TOTAL_COLOR = "#4f8ef7";

  var DAY = 864e5;
  var full = new Intl.NumberFormat("en-US");

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function (c){ return "&#" + c.charCodeAt(0) + ";"; }); }

  var extraMeta = {}, spareIndex = 0;
  function meta(key){
    if (key === "total") return { name: "Total", color: TOTAL_COLOR };
    if (PLATFORMS[key]) return PLATFORMS[key];
    if (!extraMeta[key]){
      extraMeta[key] = {
        name: key.charAt(0).toUpperCase() + key.slice(1),
        color: SPARE_COLORS[spareIndex++ % SPARE_COLORS.length]
      };
    }
    return extraMeta[key];
  }
  function unit(key){ return key === "total" ? "followers" : (meta(key).unit || "followers"); }

  /* 60994 -> "61K", 61234 -> "61.2K", 1450000 -> "1.5M" - same rounding the
     updater uses. Rounds whole tenths, since toFixed(1) rounds the binary float
     and can turn 1.45 into "1.4". */
  function compact(n){
    var a = Math.abs(n), sign = n < 0 ? "-" : "";
    if (a < 1000) return sign + String(Math.round(a));
    var div = a >= 1e6 ? 1e6 : 1e3, suf = a >= 1e6 ? "M" : "K";
    var tenths = Math.round(a / (div / 10));
    if (suf === "K" && tenths >= 10000){ div = 1e6; suf = "M"; tenths = Math.round(a / (div / 10)); }
    var whole = Math.floor(tenths / 10), frac = tenths % 10;
    return sign + whole + (frac ? "." + frac : "") + suf;
  }
  function signed(n){ return (n > 0 ? "+" : n < 0 ? "−" : "") + full.format(Math.abs(n)); }
  function pctText(p){
    var r = Math.round(p * 10) / 10;
    return (r > 0 ? "+" : r < 0 ? "−" : "") + full.format(Math.abs(r)) + "%";
  }
  function trend(n){ return n > 0 ? "is-up" : n < 0 ? "is-down" : ""; }
  function toUTC(dateStr){ var p = dateStr.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function label(ms, opts){
    return new Date(ms).toLocaleDateString("en-US", Object.assign({ month: "short", day: "numeric", timeZone: "UTC" }, opts || {}));
  }
  function listNames(names){
    if (names.length <= 1) return names.join("");
    return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
  }

  /* ---------- data ---------- */

  function normalize(rows){
    return (Array.isArray(rows) ? rows : [])
      .filter(function (r){ return r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(r.followers); })
      .map(function (r){
        var p = {};
        if (r.platforms && typeof r.platforms === "object"){
          Object.keys(r.platforms).forEach(function (k){
            if (/^[a-z0-9]+$/.test(k) && isFinite(r.platforms[k])) p[k] = +r.platforms[k];
          });
        }
        return { t: toUTC(r.date), total: +r.followers, platforms: p, est: r.estimated === true };
      })
      .sort(function (a, b){ return a.t - b.t; });
  }

  /* 30 believable made-up days ending at the real latest numbers, each platform
     growing at its own pace. Seeded, so it looks the same on every visit. Only
     used if the history file ever has fewer than MIN_REAL_DAYS entries. */
  var FALLBACK_SPLIT = { instagram: 50608, youtube: 5720, tiktok: 4666, discord: 935 };
  function sampleDays(latest){
    var split = latest && Object.keys(latest.platforms).length ? latest.platforms : null;
    if (!split){
      var sum = 0, k;
      for (k in FALLBACK_SPLIT) sum += FALLBACK_SPLIT[k];
      var target = latest ? latest.total : sum;
      split = {};
      for (k in FALLBACK_SPLIT) split[k] = Math.round(FALLBACK_SPLIT[k] * target / sum);
    }
    var seed = 20260911;
    function rand(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
    var COUNT = 30;
    var now = new Date();
    var end = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    var keys = Object.keys(split).sort(function (a, b){ return split[b] - split[a]; });
    var curves = {};
    keys.forEach(function (key, n){
      var endV = split[key];
      var growth = [0.10, 0.07, 0.17, 0.12, 0.09][n % 5];
      var startV = Math.round(endV / (1 + growth));
      var steps = [0];
      for (var i = 1; i < COUNT; i++){
        var s = 0.5 + rand() * 1.5;
        if (n === 0 && i === 17) s += 7;
        if (n === 0 && i === 18) s += 3;
        if (n === 2 && i === 23) s += 6;
        steps.push(steps[i - 1] + s);
      }
      var scale = (endV - startV) / steps[COUNT - 1];
      curves[key] = steps.map(function (st){ return Math.round(startV + st * scale); });
      curves[key][COUNT - 1] = endV;
    });
    var out = [];
    for (var d = 0; d < COUNT; d++){
      var p = {}, total = 0;
      keys.forEach(function (key){ p[key] = curves[key][d]; total += curves[key][d]; });
      out.push({ t: end - (COUNT - 1 - d) * DAY, total: total, platforms: p, est: false });
    }
    if (latest) out[COUNT - 1].total = latest.total;
    return out;
  }

  /* ---------- state ---------- */

  var days = [], shownDays = [], platformKeys = [];
  var rangeDays = 30, selected = "total";
  var drawn = null, playIntro = true;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var svg = el("chart-svg"), chart = el("chart"), tip = el("tip");

  function valueOf(day, key){ return key === "total" ? day.total : day.platforms[key]; }
  function series(key){
    return shownDays
      .filter(function (d){ return isFinite(valueOf(d, key)); })
      .map(function (d){ return { t: d.t, v: valueOf(d, key), est: d.est }; });
  }

  function applyRange(){
    var lastT = days[days.length - 1].t;
    shownDays = rangeDays ? days.filter(function (d){ return d.t > lastT - rangeDays * DAY; }) : days.slice();
    if (shownDays.length < 2 && days.length >= 2) shownDays = days.slice(-2);
  }

  /* ---------- drawing helpers ---------- */

  /* Smooth line that never overshoots the data (Fritsch-Carlson monotone cubic). */
  function smoothPath(p){
    var n = p.length;
    if (n < 2) return "";
    var f = function (v){ return v.toFixed(1); };
    if (n === 2) return "M" + f(p[0].x) + "," + f(p[0].y) + "L" + f(p[1].x) + "," + f(p[1].y);
    var dx = [], m = [], t = [], i;
    for (i = 0; i < n - 1; i++){ dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / dx[i]; }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (i = 0; i < n - 1; i++){
      if (m[i] === 0){ t[i] = 0; t[i + 1] = 0; continue; }
      var a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
      if (s > 9){ var k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
    }
    var d = "M" + f(p[0].x) + "," + f(p[0].y);
    for (i = 0; i < n - 1; i++){
      var h = dx[i] / 3;
      d += "C" + f(p[i].x + h) + "," + f(p[i].y + t[i] * h) + " " +
                 f(p[i + 1].x - h) + "," + f(p[i + 1].y - t[i + 1] * h) + " " +
                 f(p[i + 1].x) + "," + f(p[i + 1].y);
    }
    return d;
  }

  /* Round axis steps (1, 2, 5 x 10^n) so labels read 58K, 60K, 62K not 58,341. */
  function niceTicks(min, max, count){
    var span = max - min || 1;
    var step = Math.pow(10, Math.floor(Math.log10(span / count)));
    var err = span / count / step;
    if (err >= 7.5) step *= 10; else if (err >= 3) step *= 5; else if (err >= 1.5) step *= 2;
    var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (var i = 0, v = lo; v <= hi + step / 2; i++, v = lo + i * step) ticks.push(Math.round(v * 1e6) / 1e6);
    return ticks;
  }

  /* Ticks for a log axis between 10^llo and 10^lhi: 1-2-5 steps when that gives
     a handful, otherwise just the powers of ten. */
  function logTicks(llo, lhi){
    var e0 = Math.floor(llo), e1 = Math.ceil(lhi), ticks = [];
    [[1, 2, 5], [1]].some(function (steps){
      ticks = [];
      for (var e = e0; e <= e1; e++){
        steps.forEach(function (m){
          var v = m * Math.pow(10, e), l = Math.log10(v);
          if (l >= llo - 1e-9 && l <= lhi + 1e-9) ticks.push(v);
        });
      }
      return ticks.length <= 6;
    });
    if (ticks.length < 2){
      ticks = [llo, lhi].map(function (l){
        var v = Math.pow(10, l), mag = Math.pow(10, Math.floor(l) - 1);
        return Math.round(v / mag) * mag;
      });
    }
    return ticks;
  }

  /* ---------- chart ---------- */

  function draw(){
    var W = chart.clientWidth, H = chart.clientHeight;
    if (!W || !H) return;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    hideTip();

    var compare = selected === "compare";
    var plots;
    if (compare){
      /* all platforms at once on a log scale, so a 5K account and a 50K
         account are both readable and their growth can be compared by slope */
      plots = platformKeys.map(function (key){
        var s = series(key);
        if (!s.length) return null;
        return {
          key: key, color: meta(key).color,
          data: s.map(function (p){ return { t: p.t, v: Math.max(1, p.v), raw: p.v }; })
        };
      }).filter(Boolean);
    } else {
      var s = series(selected);
      plots = s.length ? [{
        key: selected, color: meta(selected).color,
        data: s.map(function (p){ return { t: p.t, v: p.v, raw: p.v }; })
      }] : [];
    }

    if (!plots.length){
      svg.innerHTML = "";
      drawn = null;
      return;
    }

    var pad = { l: 48, r: 14, t: 14, b: 28 };
    var innerH = H - pad.t - pad.b;
    var t0 = shownDays[0].t, t1 = shownDays[shownDays.length - 1].t;
    if (t1 === t0){ t0 -= DAY; t1 += DAY; }
    function X(t){ return pad.l + (t - t0) / (t1 - t0) * (W - pad.l - pad.r); }

    var values = [];
    plots.forEach(function (pl){ pl.data.forEach(function (p){ values.push(p.v); }); });
    var vmin = Math.min.apply(null, values), vmax = Math.max.apply(null, values);

    var ticks, Y, base, tickText = compact;
    if (compare){
      var lmin = Math.log10(vmin), lmax = Math.log10(vmax);
      var lroom = Math.max((lmax - lmin) * 0.08, 0.04);
      var llo = lmin - lroom, lhi = lmax + lroom;
      ticks = logTicks(llo, lhi);
      Y = function (v){ return pad.t + (1 - (Math.log10(v) - llo) / (lhi - llo)) * innerH; };
      base = pad.t + innerH;
    } else {
      var room = (vmax - vmin) * 0.18 || Math.max(1, Math.abs(vmax) * 0.01);
      /* counts can't go negative, so the breathing room below a line that starts
         at 0 stops at 0 instead of adding a "-500" tick */
      var lower = vmin - room;
      if (vmin >= 0 && lower < 0) lower = 0;
      ticks = niceTicks(lower, vmax + room, 4);
      var ylo = ticks[0], yhi = ticks[ticks.length - 1];
      Y = function (v){ return pad.t + (1 - (v - ylo) / (yhi - ylo)) * innerH; };
      base = Y(ylo);
    }

    plots.forEach(function (pl){
      pl.pts = pl.data.map(function (p){ return { x: X(p.t), y: Y(p.v), t: p.t, v: p.v, raw: p.raw }; });
    });

    var out = ['<defs>'];
    plots.forEach(function (pl, i){
      out.push('<linearGradient id="ga' + i + '" x1="0" y1="0" x2="0" y2="1">' +
               '<stop offset="0" stop-color="' + pl.color + '" stop-opacity=".40"/>' +
               '<stop offset="1" stop-color="' + pl.color + '" stop-opacity="0"/></linearGradient>');
    });
    out.push('<linearGradient id="gl-total" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#8ec9ff"/></linearGradient>');
    out.push('<filter id="f-glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>');
    out.push('</defs>');

    ticks.forEach(function (v){
      var y = Y(v).toFixed(1);
      out.push('<line class="grid" x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '"/>');
      out.push('<text class="ylab" x="' + (pad.l - 9) + '" y="' + y + '" dy="0.32em" text-anchor="end">' + tickText(v) + '</text>');
    });

    var labelCount = Math.min(shownDays.length, W < 440 ? 3 : 5);
    for (var i = 0; i < labelCount; i++){
      var idx = labelCount === 1 ? 0 : Math.round(i * (shownDays.length - 1) / (labelCount - 1));
      var anchor = labelCount === 1 ? "middle" : i === 0 ? "start" : i === labelCount - 1 ? "end" : "middle";
      out.push('<text class="xlab" x="' + X(shownDays[idx].t).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="' + anchor + '">' + label(shownDays[idx].t) + '</text>');
    }

    plots.forEach(function (pl, i){
      var line = smoothPath(pl.pts);
      var stroke = pl.key === "total" ? "url(#gl-total)" : pl.color;
      var last = pl.pts[pl.pts.length - 1], first = pl.pts[0];
      if (line){
        if (!compare){
          var areaD = line + 'L' + last.x.toFixed(1) + ',' + base.toFixed(1) + 'L' + first.x.toFixed(1) + ',' + base.toFixed(1) + 'Z';
          out.push('<path class="area" d="' + areaD + '" fill="url(#ga' + i + ')"/>');
        }
        out.push('<path class="line-glow" d="' + line + '" stroke="' + stroke + '" filter="url(#f-glow)"/>');
        out.push('<path class="line" d="' + line + '" stroke="' + stroke + '"/>');
      }
      out.push('<circle class="end-halo" style="--c:' + pl.color + '" cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="7"/>');
      out.push('<circle class="end-dot" style="--c:' + pl.color + '" cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="4.5"/>');
    });

    out.push('<g id="hover" style="display:none"><line class="hover-line" id="hover-line" y1="' + pad.t + '" y2="' + base.toFixed(1) + '"/>');
    plots.forEach(function (pl, i){ out.push('<circle class="hover-dot" id="hover-dot-' + i + '" style="--c:' + pl.color + '" r="5"/>'); });
    out.push('</g>');

    svg.innerHTML = out.join("");
    svg.setAttribute("aria-label", compare
      ? "Line chart, log scale, of followers on " + listNames(platformKeys.map(function (k){ return meta(k).name; }))
      : "Line chart of " + (selected === "total" ? "total" : meta(selected).name) + " followers over time");

    drawn = {
      compare: compare,
      plots: plots,
      days: shownDays.map(function (d){ return { t: d.t, x: X(d.t), est: d.est }; })
    };

    if (playIntro && !reduceMotion){
      svg.classList.remove("intro");
      void svg.getBoundingClientRect();       /* restart the animation */
      svg.classList.add("intro");
    } else {
      svg.classList.remove("intro");
    }
    playIntro = false;
  }

  function hideTip(){
    tip.classList.remove("on");
    var g = svg.querySelector("#hover");
    if (g) g.style.display = "none";
  }

  function showTipAt(clientX){
    if (!drawn) return;
    var box = svg.getBoundingClientRect();
    var x = clientX - box.left;
    var k = 0;
    for (var i = 1; i < drawn.days.length; i++){
      if (Math.abs(drawn.days[i].x - x) < Math.abs(drawn.days[k].x - x)) k = i;
    }
    var day = drawn.days[k], t = day.t, hx = day.x;

    var g = svg.querySelector("#hover");
    g.style.display = "";
    var hl = svg.querySelector("#hover-line");
    hl.setAttribute("x1", hx); hl.setAttribute("x2", hx);

    var topY = Infinity, rows = [];
    drawn.plots.forEach(function (pl, i){
      var dot = svg.querySelector("#hover-dot-" + i);
      var j = -1;
      for (var n = 0; n < pl.pts.length; n++) if (pl.pts[n].t === t){ j = n; break; }
      if (j < 0){ dot.style.display = "none"; return; }
      var p = pl.pts[j];
      dot.style.display = "";
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
      topY = Math.min(topY, p.y);
      rows.push({ key: pl.key, p: p, prev: j > 0 ? pl.pts[j - 1] : null });
    });
    if (!rows.length){ tip.classList.remove("on"); return; }

    el("tip-date").textContent = label(t, { weekday: "short", year: "numeric" });
    var value = el("tip-value"), delta = el("tip-delta"), list = el("tip-rows");

    if (drawn.compare){
      value.hidden = true;
      delta.hidden = true;
      list.hidden = false;
      rows.sort(function (a, b){ return b.p.raw - a.p.raw; });
      list.innerHTML = rows.map(function (r){
        var m = meta(r.key);
        var chg = r.prev ? r.p.raw - r.prev.raw : 0;
        return '<div class="tip-row" style="--c:' + m.color + '"><span class="dot"></span>' + esc(m.name) +
               '<span class="num">' + full.format(r.p.raw) + '</span>' +
               '<span class="chg ' + trend(chg) + '">' + (r.prev ? signed(chg) : "") + '</span></div>';
      }).join("");
    } else {
      var r0 = rows[0];
      list.hidden = true;
      list.innerHTML = "";
      value.hidden = false;
      delta.hidden = false;
      value.textContent = full.format(r0.p.raw) + " " + unit(r0.key);
      if (r0.prev){
        var dd = r0.p.raw - r0.prev.raw;
        delta.textContent = signed(dd) + " vs day before";
        delta.className = "tip-delta " + trend(dd);
      } else {
        delta.textContent = "";
      }
    }

    tip.classList.add("on");
    var tw = tip.offsetWidth, th = tip.offsetHeight, W = chart.clientWidth;
    var left = Math.max(0, Math.min(W - tw, hx - tw / 2));
    var top = topY - th - 14;
    if (top < 0) top = Math.min(chart.clientHeight - th, topY + 14);
    tip.style.transform = "translate(" + left.toFixed(0) + "px," + top.toFixed(0) + "px)";
  }

  svg.addEventListener("pointermove", function (e){ showTipAt(e.clientX); });
  svg.addEventListener("pointerdown", function (e){ showTipAt(e.clientX); });
  svg.addEventListener("pointerleave", hideTip);

  /* ---------- cards, chips, summary ---------- */

  function renderPlatforms(){
    var wrap = el("platforms");
    wrap.innerHTML = "";
    el("platforms-title").hidden = !platformKeys.length;
    var lastDay = shownDays[shownDays.length - 1];

    platformKeys.forEach(function (key){
      var m = meta(key), s = series(key);
      var current = s.length ? s[s.length - 1].v : null;
      var diff = s.length > 1 ? s[s.length - 1].v - s[0].v : 0;
      var share = current != null && lastDay.total && s[s.length - 1].t === lastDay.t
        ? Math.round(current / lastDay.total * 100) + "% of total" : "";

      var b = document.createElement("button");
      b.type = "button";
      b.className = "platform";
      b.dataset.track = "growth_platform";
      b.dataset.trackLabel = key;
      b.style.setProperty("--c", m.color);
      b.setAttribute("aria-pressed", String(selected === key));
      b.setAttribute("aria-label", "Show " + m.name + " on the graph");
      b.innerHTML =
        '<span class="platform-name"><span class="dot"></span>' + esc(m.name) + '</span>' +
        '<span class="platform-count">' + (current == null ? "–" : full.format(current)) + '</span>' +
        '<span class="platform-meta"><span class="' + trend(diff) + '">' + (s.length > 1 ? signed(diff) : "new") + '</span>' +
        '<span>' + share + '</span></span>';
      b.addEventListener("click", function (){ select(selected === key ? "total" : key); });
      wrap.appendChild(b);
    });
  }

  function renderChips(){
    var box = el("series");
    box.innerHTML = "";
    box.hidden = !platformKeys.length;
    if (!platformKeys.length) return;

    var options = ["total"].concat(platformKeys);
    if (platformKeys.length >= 2) options.push("compare");

    options.forEach(function (key){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.dataset.track = "growth_view";
      b.dataset.trackLabel = key;
      b.setAttribute("aria-pressed", String(selected === key));
      if (key === "compare"){
        b.innerHTML = '<span class="dots">' + platformKeys.slice(0, 4).map(function (k){
          return '<span class="dot" style="--c:' + meta(k).color + '"></span>';
        }).join("") + '</span>Compare';
      } else {
        var m = meta(key);
        b.style.setProperty("--c", m.color);
        b.innerHTML = '<span class="dot"></span>' + esc(m.name);
      }
      b.addEventListener("click", function (){ select(key); });
      box.appendChild(b);
    });
  }

  function updateStats(){
    var key = selected === "compare" ? "total" : selected;
    var m = meta(key), s = series(key);
    var names = platformKeys.map(function (k){ return meta(k).name; });

    el("stat-total-label").textContent = key === "total" ? "Total followers" : m.name + " " + unit(key);
    el("chart-title").innerHTML = selected === "compare" ? "By platform<small>log scale</small>"
      : esc(selected === "total" ? "Followers over time" : m.name + " " + unit(key));

    var rangeName = rangeDays === 7 ? "7-day" : rangeDays === 30 ? "30-day" : "All-time";
    el("stat-change-label").textContent = rangeName + " change";

    if (!s.length){
      ["stat-total", "stat-change", "stat-avg"].forEach(function (id){ el(id).textContent = "–"; });
      return;
    }

    var last = s[s.length - 1], first = s[0];
    var diff = last.v - first.v;
    var span = Math.max(1, Math.round((last.t - first.t) / DAY));
    var lastDay = shownDays[shownDays.length - 1];

    el("stat-total").textContent = full.format(last.v);
    el("stat-total-sub").textContent = key === "total"
      ? (names.length ? listNames(names) : "All platforms")
      : (lastDay.total ? Math.round(last.v / lastDay.total * 100) + "% of total" : "");

    var change = el("stat-change");
    change.textContent = signed(diff);
    change.className = "stat-value " + trend(diff);

    var pct = el("stat-change-pct");
    pct.textContent = first.v ? pctText(diff / first.v * 100) : " ";
    pct.className = "stat-sub " + trend(diff);

    el("stat-avg").textContent = signed(Math.round(diff / span));
    el("stat-avg-sub").textContent = "over " + span + " day" + (span === 1 ? "" : "s");
  }

  function select(key){
    selected = key;
    playIntro = true;
    renderChips();
    renderPlatforms();
    updateStats();
    draw();
  }

  function setRange(n){
    rangeDays = n;
    [].forEach.call(document.querySelectorAll(".range button"), function (b){
      b.setAttribute("aria-pressed", String(+b.dataset.days === n));
    });
    applyRange();
    renderPlatforms();
    updateStats();
    draw();
  }

  [].forEach.call(document.querySelectorAll(".range button"), function (b){
    b.addEventListener("click", function (){ if (!b.disabled) setRange(+b.dataset.days); });
  });

  if ("ResizeObserver" in window){
    var lastW = 0;
    new ResizeObserver(function (){
      if (chart.clientWidth !== lastW){ lastW = chart.clientWidth; draw(); }
    }).observe(chart);
  } else {
    window.addEventListener("resize", draw);
  }

  /* ---------- load ---------- */

  fetch(DATA_URL, { cache: "no-cache" })
    .then(function (r){ return r.ok ? r.json() : []; })
    .catch(function (){ return []; })
    .then(function (rows){
      var real = normalize(rows);
      var latest = real.length ? real[real.length - 1] : null;

      if (real.length < MIN_REAL_DAYS){
        days = latest ? sampleDays(latest) : [];
        el("sample-note").hidden = !latest;
        if (latest){
          var parts = Object.keys(latest.platforms)
            .sort(function (a, b){ return latest.platforms[b] - latest.platforms[a]; })
            .map(function (k){ return esc(meta(k).name) + " " + full.format(latest.platforms[k]); });
          el("sample-text").innerHTML = "<b>Sample data.</b> Only the latest total (" + full.format(latest.total) + ")" +
            (parts.length ? " and its split (" + parts.join(" · ") + ")" : "") +
            " are real. Real daily tracking started " + label(real[0].t, { year: "numeric" }) +
            " and replaces this graph once it has " + MIN_REAL_DAYS + " days to plot.";
        }
      } else {
        days = real;
      }

      if (!days.length){
        chart.innerHTML = '<div class="empty">No follower data yet &ndash; check back after the first daily update.</div>';
        el("updated").textContent = "Waiting for first update";
        return;
      }

      /* every platform seen in the history, biggest first by its latest count */
      var latestCount = {};
      days.forEach(function (d){ Object.keys(d.platforms).forEach(function (k){ latestCount[k] = d.platforms[k]; }); });
      platformKeys = Object.keys(latestCount).sort(function (a, b){ return latestCount[b] - latestCount[a]; });

      var lastTracked = null;
      for (var i = real.length - 1; i >= 0; i--){ if (!real[i].est){ lastTracked = real[i]; break; } }
      el("updated").textContent = lastTracked
        ? "Updated " + label(lastTracked.t, { year: "numeric" })
        : "Daily tracking starting";

      var spanDays = Math.round((days[days.length - 1].t - days[0].t) / DAY) + 1;
      document.querySelector('.range button[data-days="0"]').disabled = spanDays <= 30;

      renderChips();
      setRange(30);
    });
})();
</script>
</body>
</html>
